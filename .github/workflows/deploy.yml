name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        # 联系邮箱是仓库变量(Settings → Secrets and variables → Actions → Variables),不写进代码
        run: node build.mjs
        env:
          MIYA_CONTACT_EMAIL: ${{ vars.MIYA_CONTACT_EMAIL }}
      - name: No trackers
        # 承诺「不装统计」:产物里出现常见统计 / 外部脚本就失败
        run: |
          ! grep -rIl -E "googletagmanager|gtag\(|google-analytics|plausible|umami|clarity\.ms|<script src=\"https?://|fonts\.googleapis" dist
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
